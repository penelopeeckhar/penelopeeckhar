<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="pcaeg-t">
<title id="pcaeg-t">AegisCloud — A complete delivery chain on one k3s cluster: Jenkins CI with SonarQube and Trivy gates, a local registry, ArgoCD GitOps and full observability.</title>
