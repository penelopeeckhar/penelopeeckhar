<ellipse cx="570" cy="20" rx="210" ry="240" fill="url(#pcnse-glow)"/>
</g>
<text x="36" y="48" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="2.5" fill="#C77B9B">05 · SECURITY AUDITING</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#F8F0F3">NSE-Sentinel</text><rect x="36" y="112" width="120" height="2" fill="url(#pcnse-rule)"/><text x="36" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">Custom Nmap NSE scripts in Lua that audit services, score each</text><text x="36" y="169" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">finding and roll everything into one global risk score.</text><rect x="36.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="52.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">6</text><text x="52.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">custom audits</text><rect x="216.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="232.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">0–100</text><text x="232.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">risk score per service</text><rect x="396.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="412.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">2</text><text x="412.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">report formats</text><rect x="36.0" y="320" width="37.2" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="54.6" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5"