<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="pcnse-t">
<title id="pcnse-t">NSE-Sentinel — Custom Nmap NSE scripts in Lua that audit services, score each finding and roll everything into one global risk score.</title>
<defs>
