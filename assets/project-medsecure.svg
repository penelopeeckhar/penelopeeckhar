<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="pcmed-t">
<title id="pcmed-t">MedSecureGateway — Secure email gateway for a healthcare setting: static analysis, sandbox detonation on isolated Linux and Windows VMs, and a 0–100 risk engine.</title>
<defs>
  <linearGradient id="pcmed-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#240A16"/>
  </linearGradient>
  <radialGradient id="pcmed-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pcmed-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="pcmed-clip"><rect width="100%" height="100%" rx="16"/></clipPath>
  <linearGradient id="pcmed-sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.05"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="pcmed-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity="0.05"/>
  </pattern>
</defs>
<g clip-path="url(#pcmed-clip)">
<rect width="600" height="400" rx="16" fill="url(#pcmed-bg)"/>
<rect width="600" height="400" rx="16" fill="url(#pcmed-grid)"/>
<ellipse cx="570" cy="20" rx="210" ry="240" fill="url(#pcmed-glow)">
  <animate attributeName="cx" values="570;498;570" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
</ellipse>
<rect x="-240" y="0" width="200" height="400" fill="url(#pcmed-sweep)">
  <animate attributeName="x" values="-240;640" dur="9s" repeatCount="indefinite"/>
</rect>
</g>
<text x="36" y="48" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="2.5" fill="#C77B9B">04 · EMAIL SECURITY · MALWARE TRIAGE</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#F8F0F3">MedSecureGateway</text><rect x="36" y="112" width="120" height="2" fill="url(#pcmed-rule)"><animate attributeName="width" values="90;200;90" dur="6s" repeatCount="indefinite"/></rect><text x="36" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">Secure email gateway for a healthcare setting: static</text><text x="36" y="169" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">analysis, sandbox detonation on isolated Linux and Windows</text><text x="36" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">VMs, and a 0–100 risk engine.</text><rect x="36.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="52.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">3</text><text x="52.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">isolated VMs</text><rect x="216.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="232.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">4</text><text x="232.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">YARA rule sets</text><rect x="396.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="412.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">0</text><text x="412.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">false positives, calibration</text><rect x="36.0" y="320" width="60.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="66.2" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">Python</text><rect x="104.5" y="320" width="52.8" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="130.9" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">Flask</text><rect x="165.2" y="320" width="91.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="211.0" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">PostgreSQL</text><rect x="264.8" y="320" width="45.0" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="287.2" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">YARA</text><rect x="317.8" y="320" width="60.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="348.0" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">olevba</text><rect x="386.2" y="320" width="60.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="416.5" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">Sysmon</text><text x="564" y="48" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7" fill-opacity="0.7">view repo ↗<animate attributeName="fill-opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/></text>
<rect x="0.5" y="0.5" width="599" height="399" rx="16" fill="none" stroke="#451126"/>
</svg>
