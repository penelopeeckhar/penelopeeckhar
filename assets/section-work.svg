<text x="56" y="50" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#C77B9B">02 · SELECTED WORK</text><text x="56" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F8F0F3">Platforms, not assignments.</text><rect x="56" y="110" width="160" height="2" fill="url(#pwk-rule)"><animate attributeName="width" values="120;240;120" dur="6s" repeatCount="indefinite"/></rect><circle cx="56" cy="111" r="2.6" fill="#F8F0F3"><animate attributeName="cx" values="56;286;56" dur="5.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle><text x="1144" y="140" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#E5B5C7">Every number below comes from the repository's own report or scan output.</text>
