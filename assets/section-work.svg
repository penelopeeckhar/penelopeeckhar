</g>
<text x="56" y="50" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#C77B9B">02 · SELECTED WORK</text><text x="56" y="94" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F8F0F3">Platforms, not assignments.</text><rect x="56" y="110" width="160" height="2" fill="url(#pwk-rule)"/><text x="1144" y="140" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#E5B5C7">Every number below comes from the repository's own report or scan output.</text>
<rect x="0.5" y="0.5" width="1199" height="169" rx="16" fill="none" stroke="#451126"/>
