<path class="comet" d="M16.0,1.0 H1184.0 A15,15 0 0 1 1199.0,16.0 V154.0 A15,15 0 0 1 1184.0,169.0 H16.0 A15,15 0 0 1 1.0,154.0 V16.0 A15,15 0 0 1 16.0,1.0 Z" fill="none" stroke="#F8F0F3" stroke-width="5" stroke-opacity="0.55" filter="url(#pwk-cg)" pathLength="1000" stroke-dasharray="60 940" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="4.5s" begin="-2.40s" repeatCount="indefinite"/></path><path class="comet" d="M16.0,1.0 H1184.0 A15,15 0 0 1 1199.0,16.0 V154.0 A15,15 0 0 1 1184.0,169.0 H16.0 A15,15 0 0 1 1.0,154.0 V16.0 A15,15 0 0 1 16.0,1.0 Z" fill="none" stroke="#F8F0F3" stroke-width="1.6" pathLength="1000" stroke-dasharray="60 940" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="4.5s" begin="-2.40s" repeatCount="indefinite"/></path>
</svg>
