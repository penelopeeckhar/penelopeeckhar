<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="pchos-t">
<title id="pchos-t">Hospital DB SIEM — Lightweight SIEM for medical database access, built during my CHU Hassan II internship. MySQL triggers feed anomaly rules and alerts.</title>
<defs>
  <linearGradient id="pchos-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#240A16"/>
  </linearGradient>
  <radialGradient id="pchos-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pchos-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="pchos-clip"><rect width="100%" height="100%" rx="16"/></clipPath>
  <linearGradient id="pchos-sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.05"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <pattern id="pchos-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity="0.05"/>
  </pattern>
</defs>
<g clip-path="url(#pchos-clip)">
<rect width="600" height="400" rx="16" fill="url(#pchos-bg)"/>
<rect width="600" height="400" rx="16" fill="url(#pchos-grid)"/>
<ellipse cx="570" cy="20" rx="210" ry="240" fill="url(#pchos-glow)">
  <animate attributeName="cx" values="570;498;570" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
</ellipse>
<rect x="-240" y="0" width="200" height="400" fill="url(#pchos-sweep)">
  <animate attributeName="x" values="-240;640" dur="9s" repeatCount="indefinite"/>
</rect>
</g>
<text x="36" y="48" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" letter-spacing="2.5" fill="#C77B9B">06 · SIEM · DATABASE MONITORING</text><text x="36" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#F8F0F3">Hospital DB SIEM</text><rect x="36" y="112" width="120" height="2" fill="url(#pchos-rule)"><animate attributeName="width" values="90;200;90" dur="6s" repeatCount="indefinite"/></rect><text x="36" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">Lightweight SIEM for medical database access, built during my</text><text x="36" y="169" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">CHU Hassan II internship. MySQL triggers feed anomaly rules</text><text x="36" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#E5B5C7">and alerts.</text><rect x="36.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="52.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">4</text><text x="52.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">anomaly rules</text><rect x="216.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="232.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">daily</text><text x="232.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">CSV report + alerts</text><rect x="396.0" y="226" width="168.0" height="74" rx="10" fill="#10070C" fill-opacity="0.75" stroke="#451126"/><text x="412.0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#F8F0F3">1</text><text x="412.0" y="285" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C77B9B">SQLMap test module</text><rect x="36.0" y="320" width="60.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="66.2" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">Python</text><rect x="104.5" y="320" width="52.8" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="130.9" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">Flask</text><rect x="165.2" y="320" width="52.8" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="191.6" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">MySQL</text><rect x="226.0" y="320" width="60.5" height="24" rx="5" fill="#451126" fill-opacity="0.55" stroke="#701A3D"/><text x="256.2" y="336.5" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7">SQLMap</text><text x="564" y="48" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#E5B5C7" fill-opacity="0.7">view repo ↗<animate attributeName="fill-opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/></text>
<rect x="0.5" y="0.5" width="599" height="399" rx="16" fill="none" stroke="#451126"/>
</svg>
