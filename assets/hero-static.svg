<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="amh-title amh-desc">
<title id="amh-title">Abir Majdi — Cloud Security &amp; DevSecOps</title>
<desc id="amh-desc">Animated burgundy banner with a drawn shield, orbital rings and a technical grid.</desc>
<defs>
  <linearGradient id="amh-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/>
    <stop offset="0.55" stop-color="#190B12"/>
    <stop offset="1" stop-color="#2A0C19"/>
  </linearGradient>
  <radialGradient id="amh-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
    <stop offset="0.6" stop-color="#451126" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#451126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="amh-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#C77B9B"/>
    <stop offset="0.7" stop-color="#E5B5C7"/>
    <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="amh-sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="amh-shieldfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#451126" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="amh-grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
  <filter id="amh-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <clipPath id="amh-clip"><rect width="1200" height="400" rx="18"/></clipPath>
</defs>

<g clip-path="url(#amh-clip)">
  <rect width="1200" height="400" fill="url(#amh-bg)"/>
  <rect width="1200" height="400" fill="url(#amh-grid)"/>

  <!-- moving light -->
  <ellipse cx="900" cy="200" rx="360" ry="260" fill="url(#amh-glow)">
    
    
  </ellipse>
  <!-- scan sweep -->
  <rect x="-300" y="0" width="260" height="400" fill="url(#amh-sweep)">
    
  </rect>

  <!-- left accent rule -->
  <rect x="72" y="92" width="3" height="214" fill="#C77B9B" opacity="0.8"/>

  <!-- text block -->
  <text x="100" y="118" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" letter-spacing="3" fill="#C77B9B">ENSA FÈS · GDNC · CLASS OF 2027</text>
  <text x="96" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#F8F0F3" letter-spacing="1">Abir Majdi</text>
  <text x="100" y="242" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#E5B5C7">Cloud Security · DevSecOps · Detection Engineering</text>

  <!-- glowing underline -->
  <rect x="100" y="262" width="470" height="3" rx="1.5" fill="url(#amh-line)" filter="url(#amh-blur)">
    
  </rect>
  <rect x="100" y="262" width="470" height="2" rx="1" fill="url(#amh-line)">
    
  </rect>

  <text x="100" y="306" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="17" fill="#F8F0F3" fill-opacity="0.85">
    <tspan fill="#C77B9B">abir@aegiscloud</tspan><tspan fill="#E5B5C7">:~$</tspan> build → scan → deploy → monitor<tspan class="amh-type" fill="#C77B9B"> ▍</tspan>
  </text>
  <text x="100" y="340" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="14" fill="#E5B5C7" fill-opacity="0.55">Jenkins · Trivy · ArgoCD · k3s · Prometheus · Wazuh · TheHive</text>

  <!-- emblem -->
  <g transform="translate(905 205)">
    <ellipse rx="190" ry="62" fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
      
    </ellipse>
    <ellipse rx="190" ry="62" fill="none" stroke="#E5B5C7" stroke-opacity="0.18" stroke-width="1" transform="rotate(60)">
      
    </ellipse>
    <circle r="150" fill="none" stroke="#C77B9B" stroke-opacity="0.12" stroke-dasharray="2 9"/>
    <circle r="4" fill="#E5B5C7">
      
    </circle>
    <line x1="0" y1="0" x2="-150" y2="-40" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1"/><circle cx="-150" cy="-40" r="3.2" fill="#E5B5C7"></circle><line x1="0" y1="0" x2="150" y2="-10" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1"/><circle cx="150" cy="-10" r="3.2" fill="#E5B5C7"></circle><line x1="0" y1="0" x2="-120" y2="95" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1"/><circle cx="-120" cy="95" r="3.2" fill="#E5B5C7"></circle><line x1="0" y1="0" x2="128" y2="100" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1"/><circle cx="128" cy="100" r="3.2" fill="#E5B5C7"></circle><line x1="0" y1="0" x2="0" y2="-165" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1"/><circle cx="0" cy="-165" r="3.2" fill="#E5B5C7"></circle>
    <path d="M0,-112 L86,-80 L86,6 C86,62 46,100 0,120 C-46,100 -86,62 -86,6 L-86,-80 Z" fill="url(#amh-shieldfill)" stroke="none"/>
    <path d="M0,-112 L86,-80 L86,6 C86,62 46,100 0,120 C-46,100 -86,62 -86,6 L-86,-80 Z" fill="none" stroke="#E5B5C7" stroke-width="2.5" stroke-linejoin="round"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0">
      
    </path>
    <path d="M-38,4 L-10,32 L42,-26" fill="none" stroke="#F8F0F3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0">
      
    </path>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#701A3D" stroke-opacity="0.7"/>
</g>
</svg>
