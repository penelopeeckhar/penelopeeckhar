<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="pab-t">
<title id="pab-t">About Abir Majdi — cloud security and DevSecOps</title>
<defs>
  <linearGradient id="pab-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#240A16"/>
  </linearGradient>
  <radialGradient id="pab-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pab-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="pab-clip"><rect width="100%" height="100%" rx="16"/></clipPath>
  <linearGradient id="pab-sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.05"/><stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <filter id="pab-cg" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="pab-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity="0.05"/>
  </pattern>
</defs>
<g clip-path="url(#pab-clip)">
<rect width="1200" height="300" rx="16" fill="url(#pab-bg)"/>
<rect width="1200" height="300" rx="16" fill="url(#pab-grid)"/>
<ellipse cx="1020" cy="60" rx="420" ry="180" fill="url(#pab-glow)">
  <animate attributeName="cx" values="1020;876;1020" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
</ellipse>
<rect x="-240" y="0" width="200" height="300" fill="url(#pab-sweep)">
  <animate attributeName="x" values="-240;1240" dur="9s" repeatCount="indefinite"/>
</rect>
</g>
<text x="56" y="56" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#C77B9B">01 · ABOUT</text><text x="56" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F8F0F3">Hello, I'm Abir.</text><rect x="56" y="116" width="160" height="2" fill="url(#pab-rule)"><animate attributeName="width" values="120;240;120" dur="6s" repeatCount="indefinite"/></rect><circle cx="56" cy="117" r="2.6" fill="#F8F0F3"><animate attributeName="cx" values="56;286;56" dur="5.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle><text x="56" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">Fifth-year engineering student in Digital Development &amp; Cybersecurity at ENSA</text><text x="56" y="197" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">Fès. I work on cloud security and DevSecOps: delivery pipelines with security</text><text x="56" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">gates, container and Kubernetes hardening, GitOps, observability, and the</text><text x="56" y="251" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">detection and response layer on top.</text><text x="56" y="286" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#C77B9B">Build it end to end. Measure what it enforces. Document the gaps.</text><rect x="860" y="48" width="290" height="208" rx="12" fill="#10070C" fill-opacity="0.7" stroke="#701A3D"/><path class="comet" d="M872.0,48.0 H1138.0 A12,12 0 0 1 1150.0,60.0 V244.0 A12,12 0 0 1 1138.0,256.0 H872.0 A12,12 0 0 1 860.0,244.0 V60.0 A12,12 0 0 1 872.0,48.0 Z" fill="none" stroke="#F8F0F3" stroke-width="5" stroke-opacity="0.55" filter="url(#pab-cg)" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="3.0s" begin="-1.20s" repeatCount="indefinite"/></path><path class="comet" d="M872.0,48.0 H1138.0 A12,12 0 0 1 1150.0,60.0 V244.0 A12,12 0 0 1 1138.0,256.0 H872.0 A12,12 0 0 1 860.0,244.0 V60.0 A12,12 0 0 1 872.0,48.0 Z" fill="none" stroke="#F8F0F3" stroke-width="1.6" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="3.0s" begin="-1.20s" repeatCount="indefinite"/></path><text x="882" y="80" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C77B9B">FOCUS</text><text x="882" y="114" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">pipelines</text><text x="1128" y="114" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Jenkins · GH Actions</text><text x="882" y="144" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">gates</text><text x="1128" y="144" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">SonarQube · Trivy</text><text x="882" y="174" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">runtime</text><text x="1128" y="174" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">k3s · ArgoCD</text><text x="882" y="204" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">observe</text><text x="1128" y="204" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Prometheus · Grafana</text><text x="882" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">respond</text><text x="1128" y="234" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Wazuh · TheHive</text>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#451126"/>
<path class="comet" d="M16.0,1.0 H1184.0 A15,15 0 0 1 1199.0,16.0 V284.0 A15,15 0 0 1 1184.0,299.0 H16.0 A15,15 0 0 1 1.0,284.0 V16.0 A15,15 0 0 1 16.0,1.0 Z" fill="none" stroke="#F8F0F3" stroke-width="5" stroke-opacity="0.55" filter="url(#pab-cg)" pathLength="1000" stroke-dasharray="60 940" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="4.7s" begin="-2.00s" repeatCount="indefinite"/></path><path class="comet" d="M16.0,1.0 H1184.0 A15,15 0 0 1 1199.0,16.0 V284.0 A15,15 0 0 1 1184.0,299.0 H16.0 A15,15 0 0 1 1.0,284.0 V16.0 A15,15 0 0 1 16.0,1.0 Z" fill="none" stroke="#F8F0F3" stroke-width="1.6" pathLength="1000" stroke-dasharray="60 940" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="1000;0" dur="4.7s" begin="-2.00s" repeatCount="indefinite"/></path>
</svg>
