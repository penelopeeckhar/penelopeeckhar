<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="pab-t">
<title id="pab-t">About Abir Majdi — cloud security and DevSecOps</title>
<defs>
  <linearGradient id="pab-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset="0.6" stop-color="#190B12"/><stop offset="1" stop-color="#240A16"/>
  </linearGradient>
  <radialGradient id="pab-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pab-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="pab-clip"><rect width="100%" height="100%" rx="16"/></clipPath>
  <pattern id="pab-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity="0.05"/>
