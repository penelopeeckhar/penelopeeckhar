<g clip-path="url(#pab-clip)">
<rect width="1200" height="300" rx="16" fill="url(#pab-bg)"/>
<rect width="1200" height="300" rx="16" fill="url(#pab-grid)"/>
<ellipse cx="1020" cy="60" rx="420" ry="180" fill="url(#pab-glow)"/>
</g>
<text x="56" y="56" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#C77B9B">01 · ABOUT</text><text x="56" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F8F0F3">Hello, I'm Abir.</text><rect x="56" y="116" width="160" height="2" fill="url(#pab-rule)"/><text x="56" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">Fifth-year engineering student in Digital Development &amp; Cybersecurity at ENSA</text><text x="56" y="197" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">Fès. I work on cloud security and DevSecOps: delivery pipelines with security</text><text x="56" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">gates, container and Kubernetes hardening, GitOps, observability, and the</text><text x="56" y="251" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#E5B5C7">detection and response layer on top.</text><text x="56" y="286" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#C77B9B">Build it end to end. Measure what it enforces. Document the gaps.</text><rect x="860" y="48" width="290" height="208" rx="12" fill="#10070C" fill-opacity="0.7" stroke="#701A3D"/><text x="882" y="80" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#C77B9B">FOCUS</text><text x="882" y="114" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">pipelines</text><text x="1128" y="114" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Jenkins · GH Actions</text><text x="882" y="144" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">gates</text><text x="1128" y="144" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">SonarQube · Trivy</text><text x="882" y="174" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">runtime</text><text x="1128" y="174" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">k3s · ArgoCD</text><text x="882" y="204" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">observe</text><text x="1128" y="204" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Prometheus · Grafana</text><text x="882" y="234" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#E5B5C7">respond</text><text x="1128" y="234" text-anchor="end" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" fill="#F8F0F3">Wazuh · TheHive</text>
<rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#451126"/>
</svg>
