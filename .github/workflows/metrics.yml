# Place this file at: .github/workflows/metrics.yml
# Generates metrics.svg and commits it to this repo — no external Vercel
# dependency, so it can't break due to a third-party deployment being paused.

name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # allow manual runs from the Actions tab
  push:
    branches: [ main ]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update metrics.svg [skip ci]"

          # Base sections
          base: header, activity, community, repositories, metadata

          # Extra plugins
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_habits: yes

          config_timezone: Africa/Casablanca
