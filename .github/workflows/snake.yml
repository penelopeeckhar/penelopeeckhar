name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/activity_heatmap.py"
      - "scripts/frame_snake.py"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: penelopeeckhar
          outputs: |
            dist/snake-raw.svg?palette=github-dark

      - name: Recolour and frame the snake
        run: |
          python3 scripts/frame_snake.py dist/snake-raw.svg dist/snake.svg
          rm dist/snake-raw.svg

      - name: Generate activity heatmap
        run: python3 scripts/activity_heatmap.py penelopeeckhar dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
